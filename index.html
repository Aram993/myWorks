<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .filters {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filters select, .filters input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            max-width: 200px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .pagination button {
            margin: 0 5px;
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        .pagination button.active {
            margin: 0 5px;
            padding: 10px 15px;
            border: none;
            background: white;
            color: #007bff;
            cursor: pointer;
            border-radius: 5px;
        }
        .limit-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .numbers {
            display: flex;
        }
        .inpt {
            margin: 0 5px;
            padding: 10px 15px;
            border: none;
            background: #52585e;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
            /* HTML: <div class="loader"></div> */
        .loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: fit-content;
            font-weight: bold;
            font-family: monospace;
            font-size: 30px;
            background:linear-gradient(90deg,#000 50%,#0000 0) right/200% 100%;
            animation: l21 2s infinite linear;
        }
        .loader::before {
            content :"Loading...";
            color: #0000;
            padding: 0 5px;
            background: inherit;
            background-image: linear-gradient(90deg,#fff 50%,#000 0);
            -webkit-background-clip:text;
            background-clip:text;
        }

        @keyframes l21{
            100%{background-position: left}
        }

        .dark {
            width: 100%;
	        height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="filters">
        <input type="text" placeholder="Поиск товара..." id="searchInput">
        <select id="categoryFilter">
            <option value="all">Все категории</option>
        </select>
        <select id="filter">
            <option value="&_sort=price&_order=asc">Цена: по возрастанию</option>
            <option value="&_sort=price&_order=desc">Цена: по убыванию</option>
            <option value="&_sort=name&_order=asc">Название: А-Я</option>
            <option value="&_sort=name&_order=desc">Название: Я-А</option>
        </select>
    </div>
    <div class="limit-info">
        <p><b>Выберите количество отбражаемых товаров на странице:</b></p>
        <div class="numbers">
            <label class="inpt">
                <input name="limit" type="radio" value="4" class="limitsInput"> 4
            </label>
            <label class="inpt">
                <input name="limit" type="radio" value="8" checked class="limitsInput"> 8
            </label>
            <label class="inpt">
                <input name="limit" type="radio" value="12" class="limitsInput"> 12
            </label>
        </div>
        
    </div>
    <div class="products"></div>
    <div class="pagination"></div>
</div>
<div class="loader"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="script.js"></script>
</body>
</html>
