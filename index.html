<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <form action="">
            <label for="input">Введите название задачи</label>
            <input type="text" id="input" class="inpt">
            <input type="submit" class="sbmt">
        </form>
        <div class="block">
            <span class="list">Список задач:</span>
            <div class="tasks">
            </div>
        </div>
    </div>
    <div class="modalBackground">
        <div class="modalActive">
            <div class="modalClose">
                <img src="./cross-svgrepo-com.svg" />
            </div>
            <div class="modalWindow">
                <div class="top">
                    <label for="t">Введите название задачи</label>
                    <input type="text" id="t">
                </div>
                <div class="top">
                    <label for="m">Введите дату создания</label>
                    <input type="date" id="m">
                </div>
                <div class="bottom">
                    <input type="radio" id="contactChoice1" name="contact" value="yes" />
                    <label for="contactChoice1">Задача выполнена</label>
                
                    <input type="radio" id="contactChoice2" name="contact" value="no" />
                    <label for="contactChoice2">Задача не выполнена</label>
                </div>
                <button class="modal-button">Отправить</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
